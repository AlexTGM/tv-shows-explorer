# Quality gate. Deploys are done by Netlify's own Git integration (production on main, previews on PRs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome (format, lint, architecture import rules)
        run: pnpm check

      - name: TypeScript
        run: pnpm typecheck

      - name: 120-line limit
        run: pnpm check:size

      - name: Production build
        run: pnpm build
